<!DOCTYPE html>
<html>
<head>
  <title>Neerazhi - Smart Drainage Intelligence</title>

  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <style>

    body{
      margin:0;
      background:#0f172a;
      color:white;
      font-family:'Segoe UI';
      text-align:center;
    }

    h1{
      margin-top:15px;
      color:#38bdf8;
    }

    #network{
      height:500px;
      margin:20px;
      background:#020617;
      border-radius:12px;
    }

    button{
      padding:10px 20px;
      border:none;
      border-radius:8px;
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
      margin:10px;
    }

    #recommend{
      margin-top:10px;
      font-size:18px;
      color:#38bdf8;
    }

    #infoPanel{
      position:fixed;
      right:20px;
      top:80px;
      width:270px;
      background:#111827;
      border-radius:12px;
      padding:15px;
      text-align:left;
      display:none;
    }

    #dnviPanel{
      margin-top:10px;
      color:#facc15;
      font-size:18px;
    }

  </style>
</head>

<body>

<h1>Neerazhi</h1>

<button onclick="toggleRain()">🌧 Toggle Rain</button>

<div id="recommend">Optimal Safe Path: --</div>

<div id="dnviPanel"></div>

<div id="network"></div>

<div id="infoPanel"></div>

<script>

// ========================
// NODES
// ========================

const nodes = new vis.DataSet([
  {id:1,x:-320,y:-120},
  {id:2,x:-180,y:-180},
  {id:3,x:-20,y:-140},
  {id:4,x:150,y:-170},
  {id:5,x:300,y:-120},

  {id:6,x:-350,y:20},
  {id:7,x:-180,y:40},
  {id:8,x:0,y:10},
  {id:9,x:160,y:60},
  {id:10,x:330,y:20},

  {id:11,x:-300,y:180},
  {id:12,x:-120,y:160},
  {id:13,x:50,y:200},
  {id:14,x:220,y:170},
  {id:15,x:350,y:210}

].map(n => ({
  ...n,
  label:"MH"+n.id
})));

// ========================
// EDGES
// ========================

const edgeArray = [

  {from:1,to:2},
  {from:2,to:3},
  {from:3,to:4},
  {from:4,to:5},

  {from:1,to:6},
  {from:2,to:7},
  {from:3,to:8},
  {from:4,to:9},
  {from:5,to:10},

  {from:6,to:7},
  {from:7,to:8},
  {from:8,to:9},
  {from:9,to:10},

  {from:6,to:11},
  {from:7,to:12},
  {from:8,to:13},
  {from:9,to:14},
  {from:10,to:15},

  {from:11,to:12},
  {from:12,to:13},
  {from:13,to:14},
  {from:14,to:15},

  {from:2,to:8},
  {from:7,to:3},
  {from:8,to:4},
  {from:9,to:13}

].map((e,i)=>({
  id:i+1,
  ...e,
  capacity:100,
  currentCapacity:100
}));

const edges = new vis.DataSet(edgeArray);

// ========================
// NETWORK
// ========================

const network = new vis.Network(
  document.getElementById("network"),
  {nodes,edges},
  {
    physics:false,

    nodes:{
      shape:"dot",
      size:20,
      font:{color:"white"}
    },

    edges:{
      color:"#64748b"
    }
  }
);

// ========================
// STATE
// ========================

let rain = false;

let levels = {};
let previousLevels = {};
let riseRates = {};
let blockageScores = {};

for(let i=1;i<=15;i++){

  levels[i] = 20 + Math.random()*20;

  previousLevels[i] = levels[i];

  riseRates[i] = 0;

  blockageScores[i] = Math.random()*15;
}

// ========================
// DETAILS
// ========================

function getDetails(id){

  return{
    serial:"SN-"+(1000+id),
    volume:(50+id*5)+" m³",
    zone:"Zone "+((id%5)+1),
    predicted:Math.floor(predictLevel(id))+"%"
  };
}

// ========================
// STATUS
// ========================

function getStatus(level){

  if(level < 35) return "safe";

  if(level < 60) return "warning";

  if(level < 80) return "high";

  return "critical";
}

// ========================
// COLORS
// ========================

function getRiskColor(risk){

  if(risk < 30) return "#22c55e";

  if(risk < 50) return "#eab308";

  if(risk < 70) return "#f97316";

  return "#ef4444";
}

// ========================
// TOGGLE RAIN
// ========================

function toggleRain(){

  rain = !rain;

  alert(rain ? "Rain Enabled 🌧" : "Rain Disabled ☀");
}

// ========================
// RISK
// ========================

function calculateRisk(id){

  return (
    0.5 * levels[id] +
    0.3 * riseRates[id] * 10 +
    0.2 * blockageScores[id]
  );
}

// ========================
// PREDICTION
// ========================

function predictLevel(id){

  return levels[id] + riseRates[id] * 5;
}

// ========================
// BUILD GRAPH
// ========================

function buildGraph(){

  let g = {};

  edges.forEach(e=>{

    if(!g[e.from]) g[e.from] = [];

    if(!g[e.to]) g[e.to] = [];

    let congestion = 100 - e.currentCapacity;

    let cost =
      1 +
      calculateRisk(e.to)/20 +
      congestion/50;

    g[e.from].push({
      node:e.to,
      cost
    });

    g[e.to].push({
      node:e.from,
      cost
    });
  });

  return g;
}

// ========================
// DIJKSTRA
// ========================

function getOptimalSafePath(){

  let graph = buildGraph();

  let start = 1;
  let max = levels[1];

  for(let i=2;i<=15;i++){

    if(levels[i] > max){

      max = levels[i];
      start = i;
    }
  }

  let target = 1;
  let min = levels[1];

  for(let i=2;i<=15;i++){

    if(levels[i] < min){

      min = levels[i];
      target = i;
    }
  }

  let dist = {};
  let prev = {};
  let visited = new Set();

  for(let i=1;i<=15;i++)
    dist[i] = Infinity;

  dist[start] = 0;

  while(true){

    let current = null;
    let best = Infinity;

    for(let i=1;i<=15;i++){

      if(!visited.has(i) && dist[i] < best){

        best = dist[i];
        current = i;
      }
    }

    if(current === null) break;

    if(current === target) break;

    visited.add(current);

    for(let nei of graph[current]){

      if(getStatus(levels[nei.node]) === "critical")
        continue;

      let nd = dist[current] + nei.cost;

      if(nd < dist[nei.node]){

        dist[nei.node] = nd;

        prev[nei.node] = current;
      }
    }
  }

  if(dist[target] === Infinity)
    return null;

  let path = [];

  let cur = target;

  while(cur !== undefined){

    path.unshift(cur);

    cur = prev[cur];
  }

  return path;
}

// ========================
// UPDATE EDGE CAPACITY
// ========================

function updateCapacities(){

  edges.forEach(e=>{

    let nearbyRisk =
      (
        calculateRisk(e.from) +
        calculateRisk(e.to)
      ) / 2;

    e.currentCapacity =
      Math.max(10, 100 - nearbyRisk);

    edges.update(e);
  });
}

// ========================
// DNVI
// ========================

function computeDNVI(){

  let arr = [];

  for(let i=1;i<=15;i++){

    let connectivity =
      buildGraph()[i].length;

    let dnvi =
      calculateRisk(i) *
      connectivity;

    arr.push({
      id:i,
      score:dnvi
    });
  }

  arr.sort((a,b)=>b.score-a.score);

  return arr.slice(0,3);
}

// ========================
// NODE CLICK
// ========================

network.on("click", function(params){

  if(params.nodes.length){

    let id = params.nodes[0];

    let d = getDetails(id);

    document.getElementById(
      "infoPanel"
    ).style.display="block";

    document.getElementById(
      "infoPanel"
    ).innerHTML = `

      <h2>MH${id}</h2>

      <p><b>Serial:</b> ${d.serial}</p>

      <p><b>Volume:</b> ${d.volume}</p>

      <p><b>Zone:</b> ${d.zone}</p>

      <p><b>Current:</b> ${Math.floor(levels[id])}%</p>

      <p><b>Predicted:</b> ${d.predicted}</p>

      <p><b>Risk:</b> ${Math.floor(calculateRisk(id))}</p>

      <p><b>Rise Rate:</b>
      ${riseRates[id].toFixed(2)}</p>

    `;
  }
});

// ========================
// MAIN UPDATE LOOP
// ========================

function update(){

  for(let i=1;i<=15;i++){

    previousLevels[i] = levels[i];

    if(rain){

      levels[i] +=
        1 + Math.random()*3;

    }else{

      levels[i] -=
        1 + Math.random()*2;
    }

    levels[i] =
      Math.max(5,
      Math.min(100, levels[i]));

    riseRates[i] =
      levels[i] -
      previousLevels[i];

    let risk =
      calculateRisk(i);

    let color =
      getRiskColor(risk);

    nodes.update({

      id:i,

      label:
        `MH${i}\n` +
        `${Math.floor(levels[i])}%`,

      color
    });
  }

  updateCapacities();

  // PATH

  let path =
    getOptimalSafePath();

  document.getElementById(
    "recommend"
  ).innerText =

    path
    ?

    "Optimal Safe Path: " +

    path.map(n=>"MH"+n)
    .join(" → ")

    :

    "No Safe Path Available!";

  // DNVI

  let critical =
    computeDNVI();

  document.getElementById(
    "dnviPanel"
  ).innerHTML =

    "Critical Vulnerable Nodes: " +

    critical.map(
      x=>"MH"+x.id
    ).join(", ");
}

setInterval(update,2000);

</script>

</body>
</html>
