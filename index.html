<!DOCTYPE html>
<html>

<head>

  <title>Neerazhi - AI Smart Drainage System</title>

  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <style>

    body{
      margin:0;
      background:#0f172a;
      font-family:'Segoe UI';
      color:white;
    }

    h1{
      text-align:center;
      color:#38bdf8;
      margin-top:10px;
    }

    .topbar{
      text-align:center;
      margin-bottom:10px;
    }

    button{
      padding:10px 20px;
      border:none;
      border-radius:8px;
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
      margin:10px;
    }

    .container{
      display:flex;
      gap:20px;
      padding:15px;
    }

    .panel{
      flex:1;
    }

    .title{
      text-align:center;
      font-size:22px;
      margin-bottom:10px;
      color:#f8fafc;
    }

    #currentNetwork,
    #predictedNetwork{
      height:520px;
      background:#020617;
      border-radius:12px;
      border:1px solid #1e293b;
    }

    #bottomPanel{
      padding:15px;
      display:flex;
      justify-content:space-around;
      font-size:18px;
      background:#111827;
      margin:10px;
      border-radius:10px;
    }

    .card{
      width:30%;
      text-align:center;
    }

    .danger{
      color:#ef4444;
      font-weight:bold;
    }

    .safe{
      color:#22c55e;
      font-weight:bold;
    }

    .warning{
      color:#facc15;
      font-weight:bold;
    }

    #infoPanel{
      position:fixed;
      right:20px;
      top:100px;
      width:280px;
      background:#111827;
      border-radius:12px;
      padding:15px;
      display:none;
      z-index:999;
      border:1px solid #334155;
    }

  </style>

</head>

<body>

<h1>Neerazhi - Smart Drainage Intelligence</h1>

<div class="topbar">

  <button onclick="toggleRain()">
    🌧 Toggle Rain
  </button>

</div>

<div class="container">

  <div class="panel">

    <div class="title">
      Current Drainage Network
    </div>

    <div id="currentNetwork"></div>

  </div>

  <div class="panel">

    <div class="title">
      Predicted Flood Map (15 mins)
    </div>

    <div id="predictedNetwork"></div>

  </div>

</div>

<div id="bottomPanel">

  <div class="card">

    <h3>Optimal Safe Path</h3>

    <div id="pathText">--</div>

  </div>

  <div class="card">

    <h3>Critical Vulnerable Nodes</h3>

    <div id="dnviText">--</div>

  </div>

  <div class="card">

    <h3>Rain Status</h3>

    <div id="rainText" class="safe">
      OFF ☀
    </div>

  </div>

</div>

<div id="infoPanel"></div>

<script>

// =====================================
// BASE NODE DATA
// =====================================

const baseNodes = [

  {id:1,x:-320,y:-120},
  {id:2,x:-180,y:-180},
  {id:3,x:-20,y:-140},
  {id:4,x:150,y:-170},
  {id:5,x:300,y:-120},

  {id:6,x:-350,y:20},
  {id:7,x:-180,y:40},
  {id:8,x:0,y:10},
  {id:9,x:160,y:60},
  {id:10,x:330,y:20},

  {id:11,x:-300,y:180},
  {id:12,x:-120,y:160},
  {id:13,x:50,y:200},
  {id:14,x:220,y:170},
  {id:15,x:350,y:210}

];

// =====================================
// CURRENT NODES
// =====================================

const currentNodes = new vis.DataSet(

  baseNodes.map(n=>({

    ...n,

    label:"MH"+n.id

  }))
);

// =====================================
// PREDICTED NODES
// =====================================

const predictedNodes = new vis.DataSet(

  JSON.parse(
    JSON.stringify(baseNodes)
  ).map(n=>({

    ...n,

    label:"MH"+n.id

  }))
);

// =====================================
// EDGE DATA
// =====================================

const edgeArray = [

  {from:1,to:2},
  {from:2,to:3},
  {from:3,to:4},
  {from:4,to:5},

  {from:1,to:6},
  {from:2,to:7},
  {from:3,to:8},
  {from:4,to:9},
  {from:5,to:10},

  {from:6,to:7},
  {from:7,to:8},
  {from:8,to:9},
  {from:9,to:10},

  {from:6,to:11},
  {from:7,to:12},
  {from:8,to:13},
  {from:9,to:14},
  {from:10,to:15},

  {from:11,to:12},
  {from:12,to:13},
  {from:13,to:14},
  {from:14,to:15},

  {from:2,to:8},
  {from:7,to:3},
  {from:8,to:4},
  {from:9,to:13}

].map((e,i)=>({

  id:i+1,

  ...e,

  arrows:"to",

  capacity:100,

  currentCapacity:100

}));

// =====================================
// EDGESETS
// =====================================

const currentEdges =
  new vis.DataSet(edgeArray);

const predictedEdges =
  new vis.DataSet(
    JSON.parse(JSON.stringify(edgeArray))
  );

// =====================================
// NETWORK OPTIONS
// =====================================

const options = {

  physics:false,

  nodes:{

    shape:"dot",

    size:22,

    font:{
      color:"white",
      size:16
    },

    borderWidth:2
  },

  edges:{

    color:"#64748b",

    width:2,

    smooth:true
  }
};

// =====================================
// CREATE NETWORKS
// =====================================

const currentNetwork =
  new vis.Network(

    document.getElementById(
      "currentNetwork"
    ),

    {
      nodes:currentNodes,
      edges:currentEdges
    },

    options
);

const predictedNetwork =
  new vis.Network(

    document.getElementById(
      "predictedNetwork"
    ),

    {
      nodes:predictedNodes,
      edges:predictedEdges
    },

    options
);

// =====================================
// GLOBAL STATE
// =====================================

let rain = false;

let levels = {};
let previousLevels = {};
let riseRates = {};
let blockageScores = {};

for(let i=1;i<=15;i++){

  levels[i] =
    20 + Math.random()*20;

  previousLevels[i] =
    levels[i];

  riseRates[i] = 0;

  blockageScores[i] =
    Math.random()*15;
}

// =====================================
// RAIN TOGGLE
// =====================================

function toggleRain(){

  rain = !rain;

  let rainText =
    document.getElementById(
      "rainText"
    );

  if(rain){

    rainText.innerHTML =
      "ON 🌧";

    rainText.className =
      "danger";

  }else{

    rainText.innerHTML =
      "OFF ☀";

    rainText.className =
      "safe";
  }
}

// =====================================
// STATUS
// =====================================

function getStatus(level){

  if(level < 35)
    return "safe";

  if(level < 60)
    return "warning";

  if(level < 80)
    return "high";

  return "critical";
}

// =====================================
// RISK COLOR
// =====================================

function getRiskColor(risk){

  if(risk < 30)
    return "#22c55e";

  if(risk < 50)
    return "#facc15";

  if(risk < 70)
    return "#f97316";

  return "#ef4444";
}

// =====================================
// CALCULATE RISK
// =====================================

function calculateRisk(id){

  return (

    0.5 * levels[id] +

    0.3 * riseRates[id] * 10 +

    0.2 * blockageScores[id]
  );
}

// =====================================
// PREDICT FUTURE LEVEL
// =====================================

function predictLevel(id){

  return levels[id] +
         riseRates[id] * 5;
}

// =====================================
// BUILD GRAPH
// =====================================

function buildGraph(){

  let g = {};

  currentEdges.forEach(e=>{

    if(!g[e.from])
      g[e.from] = [];

    if(!g[e.to])
      g[e.to] = [];

    let congestion =
      100 - e.currentCapacity;

    let cost =

      1 +

      calculateRisk(e.to)/20 +

      congestion/40;

    g[e.from].push({

      node:e.to,

      cost
    });

    g[e.to].push({

      node:e.from,

      cost
    });
  });

  return g;
}

// =====================================
// DIJKSTRA
// =====================================

function getOptimalPath(){

  let graph = buildGraph();

  let start = 1;
  let max = levels[1];

  for(let i=2;i<=15;i++){

    if(levels[i] > max){

      max = levels[i];

      start = i;
    }
  }

  let target = 1;
  let min = levels[1];

  for(let i=2;i<=15;i++){

    if(levels[i] < min){

      min = levels[i];

      target = i;
    }
  }

  let dist = {};
  let prev = {};
  let visited = new Set();

  for(let i=1;i<=15;i++)
    dist[i] = Infinity;

  dist[start] = 0;

  while(true){

    let current = null;
    let best = Infinity;

    for(let i=1;i<=15;i++){

      if(
        !visited.has(i) &&
        dist[i] < best
      ){

        best = dist[i];

        current = i;
      }
    }

    if(current === null)
      break;

    if(current === target)
      break;

    visited.add(current);

    for(let nei of graph[current]){

      if(
        getStatus(levels[nei.node])
        === "critical"
      )
        continue;

      let nd =
        dist[current] +
        nei.cost;

      if(nd < dist[nei.node]){

        dist[nei.node] = nd;

        prev[nei.node] = current;
      }
    }
  }

  if(dist[target] === Infinity)
    return null;

  let path = [];

  let cur = target;

  while(cur !== undefined){

    path.unshift(cur);

    cur = prev[cur];
  }

  return path;
}

// =====================================
// EDGE CAPACITY UPDATE
// =====================================

function updateCapacities(){

  currentEdges.forEach(e=>{

    let nearbyRisk =

      (
        calculateRisk(e.from) +
        calculateRisk(e.to)
      ) / 2;

    e.currentCapacity =

      Math.max(
        10,
        100 - nearbyRisk
      );

    currentEdges.update(e);
  });
}

// =====================================
// DNVI
// =====================================

function computeDNVI(){

  let arr = [];

  for(let i=1;i<=15;i++){

    let connectivity =

      buildGraph()[i].length;

    let dnvi =

      calculateRisk(i) *
      connectivity;

    arr.push({

      id:i,

      score:dnvi
    });
  }

  arr.sort(
    (a,b)=>
    b.score-a.score
  );

  return arr.slice(0,3);
}

// =====================================
// INFO PANEL
// =====================================

function showInfo(id){

  let predicted =
    predictLevel(id);

  document.getElementById(
    "infoPanel"
  ).style.display = "block";

  document.getElementById(
    "infoPanel"
  ).innerHTML = `

    <h2>MH${id}</h2>

    <p>
      <b>Current Level:</b>
      ${Math.floor(levels[id])}%
    </p>

    <p>
      <b>Predicted Level:</b>
      ${Math.floor(predicted)}%
    </p>

    <p>
      <b>Rise Rate:</b>
      ${riseRates[id].toFixed(2)}
    </p>

    <p>
      <b>Risk Score:</b>
      ${Math.floor(
        calculateRisk(id)
      )}
    </p>

    <p>
      <b>Status:</b>
      ${getStatus(levels[id])}
    </p>

  `;
}

currentNetwork.on(
  "click",
  function(params){

    if(params.nodes.length){

      showInfo(
        params.nodes[0]
      );
    }
  }
);

// =====================================
// UPDATE LOOP
// =====================================

function update(){

  // UPDATE WATER LEVELS

  for(let i=1;i<=15;i++){

    previousLevels[i] =
      levels[i];

    if(rain){

      levels[i] +=
        1 + Math.random()*3;

    }else{

      levels[i] -=
        1 + Math.random()*2;
    }

    levels[i] =

      Math.max(
        5,
        Math.min(100, levels[i])
      );

    riseRates[i] =

      levels[i] -
      previousLevels[i];
  }

  // UPDATE EDGE CAPACITY

  updateCapacities();

  // UPDATE CURRENT MAP

  for(let i=1;i<=15;i++){

    let risk =
      calculateRisk(i);

    currentNodes.update({

      id:i,

      label:
        `MH${i}\n` +
        `${Math.floor(levels[i])}%`,

      color:getRiskColor(risk),

      borderWidth:
        getStatus(levels[i])
        === "critical"
        ? 5 : 2
    });
  }

  // UPDATE PREDICTED MAP

  for(let i=1;i<=15;i++){

    let predicted =
      predictLevel(i);

    predictedNodes.update({

      id:i,

      label:
        `MH${i}\n` +
        `${Math.floor(predicted)}%`,

      color:getRiskColor(predicted),

      borderWidth:
        predicted > 80
        ? 5 : 2
    });
  }

  // PATH

  let path =
    getOptimalPath();

  document.getElementById(
    "pathText"
  ).innerHTML =

    path

    ?

    path.map(
      x=>"MH"+x
    ).join(" → ")

    :

    "<span class='danger'>No Safe Path</span>";

  // DNVI

  let critical =
    computeDNVI();

  document.getElementById(
    "dnviText"
  ).innerHTML =

    critical.map(
      x=>"MH"+x.id
    ).join(", ");
}

setInterval(update,2000);

</script>

</body>

</html>
